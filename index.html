<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post audiencia — Estudio Szlit &amp; Asociados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bordo-900:#3D0E1B;
  --bordo-700:#5E1728;
  --bordo-500:#8C2F45;
  --gold:#C8A356;
  --gold-soft:#EBDCB8;
  --paper:#F5F1EC;
  --paper-2:#FCFAF7;
  --ink:#221A1C;
  --gris:#776B6E;
  --linea-1:#C8A356;
  --linea-2:#5E6B3B;
  --linea-3:#A63D52;
  --radio:3px;
  --borde:1px solid rgba(61,14,27,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

.bar{background:var(--bordo-900);color:var(--paper-2);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.bar-in{max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.marca{font-family:'Spectral',Georgia,serif;font-size:19px;letter-spacing:.2px}
.tabs{display:flex;gap:2px}
.tab{
  background:transparent;border:1px solid rgba(235,220,184,.3);color:var(--gold-soft);
  padding:8px 15px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
  border-radius:var(--radio);transition:background .15s,color .15s;display:flex;align-items:center;gap:8px;
}
.tab:hover{background:rgba(235,220,184,.11)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--bordo-900);border-color:var(--gold);font-weight:600}
.tab .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;min-width:20px;padding:1px 5px;background:rgba(255,255,255,.16);border-radius:20px;text-align:center}
.tab[aria-selected="true"] .pill{background:rgba(61,14,27,.18)}

main{max-width:1240px;margin:0 auto;padding:32px 22px 90px}
.titulo{
  font-family:'Spectral',Georgia,serif;font-size:26px;letter-spacing:.13em;text-transform:uppercase;
  padding-bottom:12px;margin-bottom:22px;border-bottom:2px solid var(--bordo-900);
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.titulo .cifra{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--gris)}

.ficha{background:var(--paper-2);border:var(--borde);border-top:3px solid var(--bordo-700);border-radius:var(--radio);padding:26px;max-width:860px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo.ancho{grid-column:1/-1}
.campo label{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.campo .ayuda{font-size:11.5px;color:var(--gris)}
.campo input,.campo select,.campo textarea{
  font-family:inherit;font-size:14px;padding:9px 11px;color:var(--ink);background:#fff;
  border:1px solid rgba(61,14,27,.22);border-radius:var(--radio);transition:border-color .15s,box-shadow .15s;
}
.campo textarea{min-height:86px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--bordo-500);box-shadow:0 0 0 3px rgba(140,47,69,.14)}
.campo .req{color:var(--bordo-500)}

.campo.mal input,.campo.mal select,.campo.mal textarea{border-color:var(--bordo-500);background:#FDF6F7}
.campo .error{font-size:11.5px;color:var(--bordo-500);font-weight:500}

.acciones{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:var(--borde)}
.btn{border:1px solid var(--bordo-900);background:var(--bordo-900);color:var(--paper-2);padding:11px 22px;font-size:13.5px;font-weight:500;border-radius:var(--radio);letter-spacing:.02em;transition:background .15s}
.btn:hover{background:var(--bordo-700)}
.btn.fantasma{background:transparent;color:var(--bordo-900);border-color:rgba(61,14,27,.3)}
.btn.fantasma:hover{background:rgba(61,14,27,.06)}
.nota-envio{font-size:12px;color:var(--gris)}

.barra-tablero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.filtros{display:flex;gap:2px}
.filtro{background:transparent;border:1px solid rgba(61,14,27,.22);color:var(--bordo-700);padding:6px 13px;font-size:12px;border-radius:var(--radio)}
.filtro[aria-pressed="true"]{background:var(--bordo-900);color:var(--paper-2);border-color:var(--bordo-900)}
.tablero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.linea{background:var(--paper-2);border:var(--borde);border-radius:var(--radio);overflow:hidden}
.placa{background:var(--bordo-900);color:var(--paper-2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--acento)}
.placa .num{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:500;letter-spacing:.12em;display:flex;align-items:center;gap:10px}
.placa .num::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acento);box-shadow:0 0 0 3px rgba(255,255,255,.11)}
.placa .rol{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);opacity:.85;text-align:right;max-width:120px;line-height:1.35}
.tally{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:7px 16px;border-bottom:var(--borde);color:var(--gris);background:rgba(61,14,27,.03);display:flex;justify-content:space-between}
.pila{padding:12px;display:flex;flex-direction:column;gap:12px;min-height:120px}

.msj{border:var(--borde);border-left:3px solid var(--acento);border-radius:var(--radio);background:#fff;padding:13px}
.msj.enviado{opacity:.5;border-left-color:var(--gris)}
.msj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.msj-quien{font-size:13px;font-weight:600;line-height:1.3}
.msj-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--gris);letter-spacing:.04em}
.msj-etq{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:rgba(61,14,27,.07);color:var(--bordo-700);white-space:nowrap}
.msj-cuerpo{font-size:13px;line-height:1.55;white-space:pre-wrap;color:#33282B;background:var(--paper);border-radius:var(--radio);padding:10px 11px;max-height:190px;overflow:auto}
.msj-pie{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mini{border:1px solid rgba(61,14,27,.24);background:transparent;color:var(--bordo-700);font-size:11.5px;padding:5px 11px;border-radius:var(--radio);transition:background .15s;text-decoration:none;display:inline-block}
.mini:hover{background:rgba(61,14,27,.07)}
.mini.ok{background:var(--bordo-900);color:var(--paper-2);border-color:var(--bordo-900)}
.vacio{font-size:12.5px;color:var(--gris);text-align:center;padding:26px 12px;border:1px dashed rgba(61,14,27,.2);border-radius:var(--radio)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--bordo-900);color:var(--paper-2);padding:11px 20px;border-radius:var(--radio);font-size:13px;box-shadow:0 8px 26px rgba(61,14,27,.3);border-left:3px solid var(--gold);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.ver{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){.tablero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}main{padding:24px 16px 70px}.titulo{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <span class="marca">Szlit &amp; Asociados</span>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-vista="carga">Cargar</button>
      <button class="tab" role="tab" aria-selected="false" data-vista="despacho">
        Mensajes a enviar <span class="pill" id="pill-pend">0</span>
      </button>
    </nav>
  </div>
</header>

<main>
  <section id="vista-carga">
    <h1 class="titulo">Post audiencia</h1>
    <div class="ficha">
      <div id="form-audiencia">
        <div class="grid" id="grid-campos"></div>
        <div class="acciones">
          <button type="button" class="btn" id="btn-cargar">Cargar</button>
          <button type="button" class="btn fantasma" id="btn-limpiar">Limpiar</button>
          <span class="nota-envio" id="nota-envio"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="vista-despacho" hidden>
    <h1 class="titulo">Mensajes a enviar <span class="cifra" id="cifra-pend"></span></h1>
    <div class="barra-tablero">
      <div class="filtros">
        <button class="filtro" data-filtro="pendientes" aria-pressed="true">Pendientes</button>
        <button class="filtro" data-filtro="todos" aria-pressed="false">Todos</button>
      </div>
      <button class="btn fantasma" id="btn-limpiar-enviados">Quitar los enviados</button>
    </div>
    <div class="tablero" id="tablero"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<iframe name="sumidero-gform" style="display:none" title="destino oculto"></iframe>

<script>
/* =====================================================================
   BLOQUE EDITABLE — lo unico que hay que tocar
   ===================================================================== */

/* 1) LAS TRES LINEAS (celulares) */
const LINEAS = [
  { id:"0000", rol:"[rol de la linea]", acento:"var(--linea-1)" },
  { id:"8902", rol:"[rol de la linea]", acento:"var(--linea-2)" },
  { id:"8900", rol:"[rol de la linea]", acento:"var(--linea-3)" }
];
const LINEA_POR_DEFECTO = "0000";

/* 2) PREGUNTAS DEL FORMULARIO
   tipo: texto | textarea | fecha | numero | tel | select
   ancho:true -> ocupa las dos columnas. Los "id" se usan como {{id}} */
const PREGUNTAS = [
  { id:"linea_envio", etiqueta:"Enviar desde", tipo:"select", req:true, opciones:LINEAS.map(l=>l.id) },
  { id:"nombre",    etiqueta:"Nombre",                tipo:"texto",    req:true },
  { id:"correo",    etiqueta:"Correo electronico",    tipo:"texto",    req:true },
  { id:"direccion", etiqueta:"Direccion",             tipo:"texto",    req:true, ancho:true },
  { id:"telefono",  etiqueta:"Numero de telefono",    tipo:"tel",      ayuda:"Con codigo de area, sin 15" },
  { id:"que_paso",  etiqueta:"Que paso en la audiencia", tipo:"textarea", ancho:true }
];

/* 3) PLANTILLAS DE MENSAJE
   linea : "formulario" -> sale por la linea que marca el abogado al cargar.
           "0000" / "8902" / "8900" -> queda fija, ignora lo marcado.
   si    : condicion opcional {campo:"resultado", valor:["Acuerdo"]}
   cuerpo: texto con {{id_de_pregunta}} */
const PLANTILLAS = [
  {
    id:"m1", linea:"formulario", para:"Cliente", etiqueta:"Resultado",
    si:null,
    cuerpo:`[Mensaje al cliente contandole que paso.]

{{nombre}}
{{que_paso}}`
  },
  {
    id:"m2", linea:"8900", para:"[destinatario]", etiqueta:"Interno",
    si:null,
    cuerpo:`[Mensaje interno. Este sale siempre por la 8900, sin importar lo marcado.]

{{nombre}} - {{telefono}}`
  }
];

/* 4) GOOGLE FORMS (opcional)
   Para activarlo: crear el Form con una pregunta por cada id de PREGUNTAS,
   sacar el "vinculo previamente completado" para leer los entry.XXXXXXX,
   pegarlos aca y poner activo:true. */
const GOOGLE_FORM = {
  activo:true,
  formId:"1FAIpQLScKDYEKigMYBxLcorubXYrA2vhCrsHIi4D6SF_9sRNIbttdig",
  fechas:[],                    // ninguna pregunta del Form es de tipo Fecha
  entradas:{
    nombre:"entry.2005620554",     // Nombre
    correo:"entry.1045781291",     // Correo electronico
    direccion:"entry.1065046570",  // Direccion
    telefono:"entry.1166974658",   // Numero de telefono
    que_paso:"entry.839337160"     // Que paso en la audiencia
  }
};

/* =====================================================================
   FIN DEL BLOQUE EDITABLE
   ===================================================================== */

const estado = { mensajes:[], filtro:"pendientes" };
const $ = s => document.querySelector(s);

function pintarFormulario(){
  $("#grid-campos").innerHTML = PREGUNTAS.map(p=>{
    const req = p.req ? ' <span class="req">*</span>' : '';
    const ayuda = p.ayuda ? `<span class="ayuda">${p.ayuda}</span>` : '';
    let control;
    if(p.tipo === "textarea"){
      control = `<textarea id="c-${p.id}" name="${p.id}"></textarea>`;
    } else if(p.tipo === "select"){
      control = `<select id="c-${p.id}" name="${p.id}"><option value="">Elegir...</option>` +
        (p.opciones||[]).map(o=>`<option>${o}</option>`).join('') + `</select>`;
    } else {
      const t = p.tipo === "fecha" ? "date" : p.tipo === "numero" ? "number" : p.tipo === "tel" ? "tel" : "text";
      control = `<input type="${t}" id="c-${p.id}" name="${p.id}">`;
    }
    return `<div class="campo ${p.ancho?'ancho':''}" id="w-${p.id}">
      <label for="c-${p.id}">${p.etiqueta}${req}</label>${control}${ayuda}
    </div>`;
  }).join('');

  $("#grid-campos").addEventListener("input", e=>{
    const w = e.target.closest(".campo");
    if(w && w.classList.contains("mal")){ w.classList.remove("mal"); const x=w.querySelector(".error"); if(x) x.remove(); }
  });
}

function leerDatos(){
  const datos = {};
  PREGUNTAS.forEach(p=>{
    const el = $("#c-"+p.id);
    datos[p.id] = el ? el.value.trim() : "";
  });
  return datos;
}
function limpiarCampos(){
  PREGUNTAS.forEach(p=>{ const el = $("#c-"+p.id); if(el) el.value = ""; });
  marcarFaltantes([]);
}

function marcarFaltantes(falta){
  document.querySelectorAll(".campo.mal").forEach(w=>{
    w.classList.remove("mal"); const x=w.querySelector(".error"); if(x) x.remove();
  });
  falta.forEach(p=>{
    const w = $("#w-"+p.id); if(!w) return;
    w.classList.add("mal");
    const s = document.createElement("span");
    s.className = "error"; s.textContent = "Falta completar";
    w.appendChild(s);
  });
}

function pintarLineas(){
  $("#tablero").innerHTML = LINEAS.map(l=>`
    <article class="linea" style="--acento:${l.acento}">
      <div class="placa">
        <span class="num">${l.id}</span>
        <span class="rol">${l.rol}</span>
      </div>
      <div class="tally"><span>pendientes</span><span id="t-${l.id}">0</span></div>
      <div class="pila" id="pila-${l.id}"></div>
    </article>`).join('');
}

function rellenar(texto, datos){
  return texto.replace(/\{\{(\w+)\}\}/g, (_, k) => (datos[k] || "").toString().trim() || "\u2014");
}
function corresponde(pl, datos){
  if(!pl.si) return true;
  return (pl.si.valor||[]).includes((datos[pl.si.campo]||"").trim());
}
function resolverLinea(pl, datos){
  if(!pl.linea || pl.linea === "formulario") return datos.linea_envio || LINEA_POR_DEFECTO;
  return pl.linea;
}
function generar(datos){
  const sello = new Date();
  const nuevos = PLANTILLAS.filter(pl=>corresponde(pl,datos)).map(pl=>({
    uid: pl.id + "-" + sello.getTime(),
    linea: resolverLinea(pl, datos),
    para: rellenar(pl.para, datos),
    etiqueta: pl.etiqueta || "",
    cuerpo: rellenar(pl.cuerpo, datos),
    cliente: datos.cliente || "\u2014",
    telefono: (datos.telefono||"").replace(/\D/g,""),
    hora: sello.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),
    enviado: false
  }));
  estado.mensajes = nuevos.concat(estado.mensajes);
  pintarMensajes();
}

function pintarMensajes(){
  LINEAS.forEach(l=>{
    const dellinea = estado.mensajes.filter(m=>m.linea===l.id);
    const pend = dellinea.filter(m=>!m.enviado).length;
    const ver = estado.filtro==="pendientes" ? dellinea.filter(m=>!m.enviado) : dellinea;
    $("#t-"+l.id).textContent = pend;
    $("#pila-"+l.id).innerHTML = ver.length ? ver.map(m=>tarjeta(m,l.acento)).join('')
      : `<div class="vacio">Sin mensajes en esta linea.</div>`;
  });
  const total = estado.mensajes.filter(m=>!m.enviado).length;
  $("#pill-pend").textContent = total;
  $("#cifra-pend").textContent = total ? total + " pendientes" : "";
}

function tarjeta(m, acento){
  const wa = m.telefono ? `<a class="mini" target="_blank" rel="noopener"
      href="https://wa.me/${m.telefono}?text=${encodeURIComponent(m.cuerpo)}">WhatsApp</a>` : '';
  return `<div class="msj ${m.enviado?'enviado':''}" style="--acento:${acento}" data-uid="${m.uid}">
    <div class="msj-top">
      <div>
        <div class="msj-quien">${m.para}</div>
        <div class="msj-meta">${m.cliente} \u00b7 ${m.hora}</div>
      </div>
      <span class="msj-etq">${m.etiqueta}</span>
    </div>
    <div class="msj-cuerpo">${m.cuerpo.replace(/</g,"&lt;")}</div>
    <div class="msj-pie">
      <button class="mini" data-accion="copiar">Copiar</button>
      ${wa}
      <button class="mini ${m.enviado?'':'ok'}" data-accion="enviado">${m.enviado?'Reabrir':'Marcar enviado'}</button>
    </div>
  </div>`;
}

function mandarAGoogleForm(datos){
  if(!GOOGLE_FORM.activo) return false;
  const f = document.createElement("form");
  f.action = `https://docs.google.com/forms/d/e/${GOOGLE_FORM.formId}/formResponse`;
  f.method = "POST"; f.target = "sumidero-gform"; f.style.display = "none";
  const agregar = (nombre, valor)=>{
    const i = document.createElement("input");
    i.type = "hidden"; i.name = nombre; i.value = valor;
    f.appendChild(i);
  };
  Object.entries(GOOGLE_FORM.entradas).forEach(([campo, entry])=>{
    const val = (datos[campo] || "").toString();
    if((GOOGLE_FORM.fechas||[]).includes(campo) && /^\d{4}-\d{2}-\d{2}$/.test(val)){
      const [a,m,d] = val.split("-");
      agregar(entry+"_year", a); agregar(entry+"_month", m); agregar(entry+"_day", d);
    } else {
      agregar(entry, val);
    }
  });
  document.body.appendChild(f); f.submit(); setTimeout(()=>f.remove(), 2000);
  return true;
}

function avisar(t){
  const el = $("#toast"); el.textContent = t; el.classList.add("ver");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("ver"), 2200);
}
function irA(vista){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.vista===vista));
  $("#vista-carga").hidden = vista!=="carga";
  $("#vista-despacho").hidden = vista!=="despacho";
  try{ window.scrollTo(0,0); }catch(_){}
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>irA(t.dataset.vista)));

document.querySelectorAll(".filtro").forEach(b=>b.addEventListener("click",()=>{
  estado.filtro = b.dataset.filtro;
  document.querySelectorAll(".filtro").forEach(x=>x.setAttribute("aria-pressed", x===b));
  pintarMensajes();
}));

$("#btn-limpiar-enviados").addEventListener("click",()=>{
  const antes = estado.mensajes.length;
  estado.mensajes = estado.mensajes.filter(m=>!m.enviado);
  pintarMensajes();
  avisar(antes===estado.mensajes.length ? "No hay enviados para quitar" : "Enviados quitados del tablero");
});

$("#btn-limpiar").addEventListener("click", limpiarCampos);

$("#btn-cargar").addEventListener("click", ()=>{
  const datos = leerDatos();
  const falta = PREGUNTAS.filter(p=>p.req && !(datos[p.id]||"").trim());
  if(falta.length){
    marcarFaltantes(falta);
    avisar("Faltan " + falta.length + " campo(s) obligatorio(s)");
    const primero = $("#c-"+falta[0].id);
    if(primero){ try{ primero.scrollIntoView({block:"center"}); }catch(_){} primero.focus(); }
    return;
  }
  marcarFaltantes([]);
  const aGoogle = mandarAGoogleForm(datos);
  generar(datos);
  limpiarCampos();
  $("#nota-envio").textContent = aGoogle ? "Ultima respuesta enviada a la planilla." : "";
  irA("despacho");
  avisar("Cargado. Mensajes en la linea " + (datos.linea_envio || LINEA_POR_DEFECTO) + ".");
});

$("#tablero").addEventListener("click", e=>{
  const b = e.target.closest("[data-accion]"); if(!b) return;
  const uid = b.closest(".msj").dataset.uid;
  const m = estado.mensajes.find(x=>x.uid===uid); if(!m) return;
  if(b.dataset.accion==="copiar"){
    const ok = ()=>{ b.textContent="Copiado"; setTimeout(()=>b.textContent="Copiar",1400); };
    const respaldo = ()=>{
      const ta = document.createElement("textarea");
      ta.value = m.cuerpo; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      let hecho=false; try{ hecho = document.execCommand("copy"); }catch(_){}
      ta.remove();
      hecho ? ok() : avisar("No se pudo copiar. Selecciona el texto a mano.");
    };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(m.cuerpo).then(ok).catch(respaldo);
    } else { respaldo(); }
  }
  if(b.dataset.accion==="enviado"){ m.enviado = !m.enviado; pintarMensajes(); }
});

window.addEventListener("error", ev=>{
  const b = document.createElement("div");
  b.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#8C2F45;color:#fff;padding:10px 16px;font:12px monospace;z-index:99";
  b.textContent = "Error: " + ev.message;
  document.body.appendChild(b);
});

pintarFormulario();
pintarLineas();
pintarMensajes();
</script>
</body>
</html>
